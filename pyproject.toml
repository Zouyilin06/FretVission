[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fretvision"
version = "0.1.0"
description = "Live audio-visual guitar key, note, chord, and tablature desktop analyzer"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "PySide6>=6.7,<6.11",
    "opencv-contrib-python>=4.10,<4.13",
    "mediapipe>=0.10.14,<0.11",
    "numpy>=1.26,<2.1",
    "scipy>=1.13,<1.16",
    "sounddevice>=0.5,<0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
gpu = [
    "onnxruntime-directml>=1.19",
]

[project.scripts]
fretvision = "fretvision.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
